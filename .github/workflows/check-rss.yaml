name: check RSS

on:
  workflow_call:
    inputs:
      archive:
        type: boolean
        default: false
      version:
        type: string
        default: dev
      revision:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: renderers/rss/go.mod
          cache-dependency-path: renderers/rss/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: Makefile
      - run: make lint format-check RUFF_PATHS=renderers/rss
      - run: make -C renderers/rss setup
      - run: make -C renderers/rss check

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: arprt-renderer-rss:check-${{ matrix.arch }}
      RELEASE_VERSION: ${{ inputs.version || 'dev' }}
      SOURCE_REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Build the native image
        run: |
          make -C renderers/rss image IMAGE="$IMAGE" VERSION="$RELEASE_VERSION" REVISION="$SOURCE_REVISION"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$SOURCE_REVISION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")" = "$RELEASE_VERSION"
      - name: Check offline unit tests and CLI with Job restrictions
        run: make -C renderers/rss container-check IMAGE="$IMAGE"
      - name: Export the exact tested image for release
        if: inputs.archive
        run: docker save "$IMAGE" --output "${{ runner.temp }}/rss-$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.archive
        with:
          name: rss-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/rss-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
