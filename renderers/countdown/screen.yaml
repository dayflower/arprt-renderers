# Synthetic configuration; pins the verified public Countdown 0.1.0 index.
apiVersion: v1
kind: ConfigMap
metadata:
  name: countdown-config-v1
data:
  config.json: |
    {
      "version": 1,
      "targetDate": "2027-01-01",
      "timezone": "Asia/Tokyo"
    }
---
apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: countdown
spec:
  refreshInterval: 30m
  imageProcessing:
    dithering: none
  source:
    job:
      volumes:
        - name: config
          configMap:
            name: countdown-config-v1
      renderer:
        # Countdown 0.1.0; verified public Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-countdown@sha256:a6a227dabbc3693da6c37e07c5a1f4a0a303aef274662bb3bf8ee350f54e48c2
        args:
          - --config
          - /etc/countdown/config.json
          - --webcappi-url
          - https://webcappi.example.com
        volumeMounts:
          - {name: config, mountPath: /etc/countdown, readOnly: true}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
