apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: picsum-spectra6
spec:
  refreshInterval: 10m
  overlay:
    enabled: true
    items: [timestamp, battery, wifi]
    cycleCorners: true
    # Adjust for your enclosure using the edge calibration Screen.
    margin:
      top: 0
      bottom: 0
      left: 0
      right: 0
  source:
    job:
      renderer:
        # Pin the Picsum 0.1.0 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-picsum@sha256:80c222a07f422d2c1e157fdab02e956f2e92af251e24db3547d1a2eecec562d2
        # The controller normalizes RGB input to the E1002's Spectra 6 palette.
        args: ["--palette", "rgb"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
