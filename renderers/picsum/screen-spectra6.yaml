apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: picsum-spectra6
spec:
  refreshInterval: 10m
  overlay:
    enabled: true
    items: [timestamp, battery, wifi]
    cycleCorners: true
    # Adjust for your enclosure using the edge calibration Screen.
    margin:
      top: 0
      bottom: 0
      left: 0
      right: 0
  source:
    job:
      renderer:
        # Pin the Picsum 0.2.0 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-picsum@sha256:3efae210201cd37cb0b730892d5ab69edd73b20cbc6e1d35f2e4a9eb8ec14f34
        # The controller normalizes RGB input to the E1002's Spectra 6 palette.
        args: ["--palette", "rgb"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
