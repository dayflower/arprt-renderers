apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: picsum
spec:
  refreshInterval: 10m
  overlay:
    enabled: true
    items: [timestamp, battery, wifi]
    cycleCorners: true
    # Adjust for your enclosure using the edge calibration Screen.
    margin:
      top: 0
      bottom: 8
      left: 4
      right: 4
  source:
    job:
      renderer:
        # Pin the verified public Picsum 0.2.2 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-picsum@sha256:2fed45dad62da82caa58f85c1fe874c1f09b2af0afec653e1e2076ab3265ee1d
        # Set to ["--palette", "bw"] for black-and-white photo output.
        args: ["--palette", "gray4"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
