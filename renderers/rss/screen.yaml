apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: rss
spec:
  refreshInterval: 15m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        # RSS 0.2.0; verified Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-rss@sha256:0e4bc54b19458281c31894923a801b8b08551b5aab6d1162bd22a7c6cf907120
        args:
          - --feed-url
          - https://news.example.com/feed.xml
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
