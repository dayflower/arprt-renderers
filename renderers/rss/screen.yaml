apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: rss
spec:
  refreshInterval: 15m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        # RSS 0.3.0, verified Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-rss@sha256:d89cf2949039c2ea0b9247e913caa7af4112d71bff36ebb69499e07af37e7b36
        args:
          - --feed-url
          - https://news.example.com/feed.xml
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
