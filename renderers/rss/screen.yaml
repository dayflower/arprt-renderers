apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: rss
spec:
  refreshInterval: 15m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        # RSS 0.1.0; verified Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-rss@sha256:5a21c46f62cb2c79a39b2e02327ca3954203470048ba0389b6252cfc9fc2c80d
        args:
          - --feed-url
          - https://news.example.com/feed.xml
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
