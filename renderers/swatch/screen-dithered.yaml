# Synthetic configuration; pins the verified public Swatch 0.1.0 index.
apiVersion: v1
kind: ConfigMap
metadata:
  name: swatch-dithered-config-v1
data:
  config.json: |
    {
      "version": 1,
      "note": "dithering: atkinson"
    }
---
apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: swatch-dithered
spec:
  # Output changes only with configuration or Context.
  refreshInterval: 24h
  imageProcessing:
    dithering: atkinson
  source:
    job:
      volumes:
        - name: config
          configMap:
            name: swatch-dithered-config-v1
      renderer:
        # Swatch 0.1.0; verified public Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-swatch@sha256:7ffdd35f7f81584058388a564c5df5b920ec4503aa0f0c06b1f5e35d1467fe20
        args:
          - --config
          - /etc/swatch/config.json
          - --webcappi-url
          - https://webcappi.example.com
        volumeMounts:
          - {name: config, mountPath: /etc/swatch, readOnly: true}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
