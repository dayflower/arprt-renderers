# Weather 0.6.1 public multi-platform image for Linux amd64 and arm64.
# All values below are synthetic. Create both resources in the controller namespace.
apiVersion: v1
kind: Secret
metadata:
  name: weather-location-v1
type: Opaque
stringData:
  latitude: '35.0'
  longitude: '135.0'
  location-name: Example City
---
apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: weather-secret
spec:
  refreshInterval: 30m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        image: ghcr.io/dayflower/arprt-renderer-weather@sha256:6854433aa46bc963c300ae604b3d777d9b373be54713d8cf08ff948adae895ce
        env:
          - name: WEATHER_LATITUDE
            valueFrom:
              secretKeyRef:
                name: weather-location-v1
                key: latitude
          - name: WEATHER_LONGITUDE
            valueFrom:
              secretKeyRef:
                name: weather-location-v1
                key: longitude
          - name: WEATHER_LOCATION_NAME
            valueFrom:
              secretKeyRef:
                name: weather-location-v1
                key: location-name
        args:
          - --latitude
          - '$(WEATHER_LATITUDE)'
          - --longitude
          - '$(WEATHER_LONGITUDE)'
          - --location-name
          - '$(WEATHER_LOCATION_NAME)'
          - --temperature-unit
          - celsius
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
