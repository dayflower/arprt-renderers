# Weather 0.2.0; verified public Linux amd64/arm64 multi-platform image.
# All values below are synthetic. Create both resources in the controller namespace.
apiVersion: v1
kind: Secret
metadata:
  name: weather-location-v1
type: Opaque
stringData:
  latitude: '35.0'
  longitude: '135.0'
  location-name: Example City
---
apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: weather-secret
spec:
  refreshInterval: 30m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        image: ghcr.io/dayflower/arprt-renderer-weather@sha256:9029926fbd67b36ebbfd1f0f747ac0b5634c0411c17d94d906ff8ee11f559d05
        env:
          - name: WEATHER_LATITUDE
            valueFrom:
              secretKeyRef:
                name: weather-location-v1
                key: latitude
          - name: WEATHER_LONGITUDE
            valueFrom:
              secretKeyRef:
                name: weather-location-v1
                key: longitude
          - name: WEATHER_LOCATION_NAME
            valueFrom:
              secretKeyRef:
                name: weather-location-v1
                key: location-name
        args:
          - --latitude
          - '$(WEATHER_LATITUDE)'
          - --longitude
          - '$(WEATHER_LONGITUDE)'
          - --location-name
          - '$(WEATHER_LOCATION_NAME)'
          - --temperature-unit
          - celsius
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
