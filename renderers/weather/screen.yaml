apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: weather
spec:
  refreshInterval: 30m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        # Weather 0.1.0; verified public Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-weather@sha256:2eef95da45eb4382ead5baf8f02d234bb5d52e4ca7af73af9fd11554c91d0ca3
        args:
          - --latitude
          - '35.0'
          - --longitude
          - '135.0'
          - --temperature-unit
          - celsius
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
