apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: weather
spec:
  refreshInterval: 30m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        # Weather 0.2.0; verified public Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-weather@sha256:9029926fbd67b36ebbfd1f0f747ac0b5634c0411c17d94d906ff8ee11f559d05
        args:
          - --latitude
          - '35.0'
          - --longitude
          - '135.0'
          - --temperature-unit
          - celsius
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
