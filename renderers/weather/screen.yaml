apiVersion: arprt.dayflower.github.io/v1alpha1
kind: ArprtScreen
metadata:
  name: weather
spec:
  refreshInterval: 30m
  imageProcessing:
    dithering: none
  source:
    job:
      renderer:
        # Weather 0.4.0; verified public Linux amd64/arm64 multi-platform image.
        image: ghcr.io/dayflower/arprt-renderer-weather@sha256:c3c2d550572671ea719df5c364565e07d6fc0e01fbb4e3bdc8a5f05a76e574c7
        args:
          - --latitude
          - '35.0'
          - --longitude
          - '135.0'
          - --temperature-unit
          - celsius
          - --webcappi-url
          - https://webcappi.example.com
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
